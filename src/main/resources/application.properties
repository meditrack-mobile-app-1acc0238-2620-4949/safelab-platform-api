spring.application.name=safelab-platform-api
spring.profiles.default=postgres
spring.messages.basename=i18n/messages,i18n/openapi
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urlsPrimaryName=es
springdoc.swagger-ui.operationsSorter=alpha
server.error.include-message=never

# CORS debe usar solo los orígenes web públicos concretos en Render.
# URL de ejemplo: https://safelab-frontend.onrender.com (sin slash final).
safelab.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}
# Respeta X-Forwarded-* cuando se utiliza HTTPS a través del proxy de Render.
server.forward-headers-strategy=framework
