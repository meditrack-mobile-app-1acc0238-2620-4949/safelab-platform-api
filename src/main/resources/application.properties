spring.application.name=safelab-platform-api
server.port=${PORT:8080}
safelab.json-server-url=${JSON_SERVER_URL:http://127.0.0.1:3000}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.error.include-message=never

# Los grupos en OpenApiConfig generan el selector automaticamente.
# NO registrar springdoc.swagger-ui.urls: duplicaria los grupos 'es' y 'en'.
springdoc.swagger-ui.urlsPrimaryName=es
# Sin tagsSorter=alpha: respetar el orden fijo de etiquetas del documento OpenAPI.
springdoc.swagger-ui.operationsSorter=alpha

# Textos de documentación y respuestas de error
spring.messages.basename=i18n/messages,i18n/openapi
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
